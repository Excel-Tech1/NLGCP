[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nlgcp-api"
version = "0.1.0"
description = "NLGCP control-plane API and research tooling foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "mypy>=1.14,<2",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/nlgcp_api",
  "research/gnss_qc/src/nlgcp_gnss_qc",
  "research/single_base_rtk/src/nlgcp_single_base",
  "research/network_rtk/src/nlgcp_network_rtk",
  "research/atmospheric_spatial_model/src/nlgcp_atmospheric_model",
  "research/vrs_generator/src/nlgcp_vrs",
  "research/hybrid_decision_engine/src/nlgcp_hybrid_decision",
  "research/rtcm_replay/src/nlgcp_rtcm_replay",
  "research/ntrip_ingestion/src/nlgcp_ntrip_ingest",
  "research/scientific_expansion/src/nlgcp_scientific_expansion",
]

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "research/gnss_qc/tests",
  "research/single_base_rtk/tests",
  "research/network_rtk/tests",
  "research/atmospheric_spatial_model/tests",
  "research/vrs_generator/tests",
  "research/hybrid_decision_engine/tests",
  "research/rtcm_replay/tests",
  "research/ntrip_ingestion/tests",
  "research/scientific_expansion/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Scientific Markdown/SVG source strings are intentionally kept readable as output text.
"research/gnss_qc/src/nlgcp_gnss_qc/aggregate.py" = ["E501"]
# RINEX fixed-format header lines are necessarily 80 columns wide.
"research/atmospheric_spatial_model/tests/phase6_fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "apps/api/src",
  "apps/api/tests",
  "research/gnss_qc/src",
  "research/gnss_qc/tests",
  "research/single_base_rtk/src",
  "research/single_base_rtk/tests",
  "research/network_rtk/src",
  "research/network_rtk/tests",
  "research/atmospheric_spatial_model/src",
  "research/vrs_generator/src",
  "research/atmospheric_spatial_model/tests",
  "research/vrs_generator/tests",
  "research/hybrid_decision_engine/src",
  "research/hybrid_decision_engine/tests",
  "research/rtcm_replay/src",
  "research/rtcm_replay/tests",
  "research/ntrip_ingestion/src",
  "research/ntrip_ingestion/tests",
  "research/scientific_expansion/src",
  "research/scientific_expansion/tests",
  "scripts/run_gnss_qc.py",
  "scripts/run_single_base_rtk.py",
  "scripts/run_network_rtk.py",
  "scripts/run_atmospheric_model.py",
  "scripts/run_vrs_generator.py",
  "scripts/run_hybrid_decision.py",
  "scripts/run_rtcm_replay.py",
  "scripts/run_ntrip_ingest.py",
  "scripts/run_scientific_expansion.py",
]
