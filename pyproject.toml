[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nlgcp-api"
version = "0.1.0"
description = "NLGCP control-plane API and research tooling foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/nlgcp_api",
  "research/single_base_rtk/src/nlgcp_single_base",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "research/single_base_rtk/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "apps/api/src",
  "apps/api/tests",
  "research/single_base_rtk/src",
  "research/single_base_rtk/tests",
  "scripts/run_single_base_rtk.py",
]
