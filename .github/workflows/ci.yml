name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/gnss-ingestor}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x", cache-dependency-path: services/gnss-ingestor/go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S services/nrtk-engine -B build/nrtk-engine
      - run: cmake --build build/nrtk-engine
      - run: ctest --test-dir build/nrtk-engine --output-on-failure
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
