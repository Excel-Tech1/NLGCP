name: nlgcp

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlgcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-nlgcp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname='postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NLGCP_DATA_ROOT: /data/nlgcp
    volumes:
      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}"
        target: /data/nlgcp
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}/manifests"
        target: /data/nlgcp/manifests
        bind:
          create_host_path: false

      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}/working"
        target: /data/nlgcp/working
        bind:
          create_host_path: false

      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}/processed"
        target: /data/nlgcp/processed
        bind:
          create_host_path: false

      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}/validation"
        target: /data/nlgcp/validation
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  gnss-ingestor:
    build:
      context: .
      dockerfile: services/gnss-ingestor/Dockerfile
    environment:
      NLGCP_INGESTOR_ADDRESS: ":8081"
      NLGCP_NTRIP_HOST: ${NLGCP_NTRIP_HOST:-}
      NLGCP_NTRIP_PORT: ${NLGCP_NTRIP_PORT:-2101}
      NLGCP_NTRIP_MOUNTPOINT: ${NLGCP_NTRIP_MOUNTPOINT:-}
      NLGCP_NTRIP_TLS: ${NLGCP_NTRIP_TLS:-false}
      NLGCP_NTRIP_USER_AGENT: ${NLGCP_NTRIP_USER_AGENT:-NLGCP-Phase10/1.0}
      NLGCP_INGESTOR_LOG_LEVEL: ${NLGCP_INGESTOR_LOG_LEVEL:-INFO}
      NLGCP_INGESTOR_METRICS: ${NLGCP_INGESTOR_METRICS:-true}
      NLGCP_NATS_URL: ${NLGCP_NATS_URL:-}
      NLGCP_NATS_SUBJECT_PREFIX: ${NLGCP_NATS_SUBJECT_PREFIX:-correction.live}
    volumes:
      - type: bind
        source: "${NLGCP_DATA_ROOT:?NLGCP_DATA_ROOT must be configured}/raw/rtcm-captures"
        target: /data/nlgcp/raw/rtcm-captures
        read_only: false
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${INGESTOR_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  nats-data:
  redis-data:
